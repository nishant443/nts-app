<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>NTS</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- Launch screen for the installed app (manifest start_url). It is static,
         cached by the service worker and shows while the dashboard loads.
         It must never contain user or company data. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nts-theme");
          var dark = stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151b23");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #131a24;
        --fg-muted: #566274;
        --accent: #1a6dff;
        --gold: #c9972b;
        --gold-soft: rgb(201 151 43 / 0.12);
        --track: #e3e8ef;
      }
      .dark {
        --bg: #151b23;
        --fg: #e9edf3;
        --fg-muted: #9aa7b8;
        --accent: #4d8cff;
        --gold: #e0b450;
        --gold-soft: rgb(224 180 80 / 0.12);
        --track: #262e3a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(120% 70% at 50% 42%, var(--gold-soft), transparent 70%), var(--bg);
        color: var(--fg-muted);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        overflow: hidden;
      }
      .logo { width: 168px; height: auto; animation: rise 0.6s ease-out both; }
      .logo-dark, .dark .logo-light { display: none; }
      .dark .logo-dark { display: block; }

      .badge { position: relative; width: 200px; height: 200px; animation: rise 0.6s 0.12s ease-out both; }
      .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .wreath path { stroke: var(--gold); }
      .wreath .leaves { fill: var(--gold); }
      .wreath { animation: fade 0.9s 0.25s ease-out both; }
      .count {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 6px;
      }
      .count strong {
        font-size: 76px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--accent);
      }
      .count span {
        margin-top: 4px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.32em;
        padding-left: 0.32em;
        color: var(--gold);
      }

      .copy { animation: rise 0.6s 0.28s ease-out both; }
      h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; color: var(--fg); }
      .years { margin: 6px 0 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--gold); }
      .motto { margin: 14px 0 0; font-size: 12.5px; font-style: italic; }

      .loader {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
        animation: rise 0.6s 0.4s ease-out both;
      }
      .loader::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }

      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <img class="logo logo-light" src="/brand/nts-logo-light.png" alt="Nutan Tech Solutions" width="457" height="209" />
    <img class="logo logo-dark" src="/brand/nts-logo-dark.png" alt="" aria-hidden="true" width="457" height="209" />

    <div class="badge" role="img" aria-label="3 years in service">
      <svg class="wreath" viewBox="0 0 200 200" aria-hidden="true">
        <g class="branch"><path d="M92.3 173.6 A74 74 0 0 1 58.6 38.7" fill="none" stroke-width="2.2" stroke-linecap="round"/><g class="leaves"><ellipse cx="81.9" cy="168.2" rx="9.0" ry="3.6" transform="rotate(222.0 81.9 168.2)"/><ellipse cx="80.7" cy="175.5" rx="9.0" ry="3.6" transform="rotate(158.0 80.7 175.5)"/><ellipse cx="63.5" cy="160.5" rx="8.6" ry="3.4" transform="rotate(238.5 63.5 160.5)"/><ellipse cx="60.3" cy="166.9" rx="8.6" ry="3.4" transform="rotate(174.5 60.3 166.9)"/><ellipse cx="47.9" cy="148.0" rx="8.2" ry="3.3" transform="rotate(255.0 47.9 148.0)"/><ellipse cx="43.3" cy="152.9" rx="8.2" ry="3.3" transform="rotate(191.0 43.3 152.9)"/><ellipse cx="36.4" cy="131.5" rx="7.8" ry="3.1" transform="rotate(271.5 36.4 131.5)"/><ellipse cx="30.8" cy="134.7" rx="7.8" ry="3.1" transform="rotate(207.5 30.8 134.7)"/><ellipse cx="30.0" cy="112.4" rx="7.4" ry="3.0" transform="rotate(288.0 30.0 112.4)"/><ellipse cx="24.0" cy="113.9" rx="7.4" ry="3.0" transform="rotate(224.0 24.0 113.9)"/><ellipse cx="29.2" cy="92.3" rx="7.0" ry="2.8" transform="rotate(304.5 29.2 92.3)"/><ellipse cx="23.4" cy="92.0" rx="7.0" ry="2.8" transform="rotate(240.5 23.4 92.0)"/><ellipse cx="34.0" cy="72.7" rx="6.6" ry="2.7" transform="rotate(321.0 34.0 72.7)"/><ellipse cx="28.9" cy="70.9" rx="6.6" ry="2.7" transform="rotate(257.0 28.9 70.9)"/><ellipse cx="44.2" cy="55.2" rx="6.2" ry="2.5" transform="rotate(337.5 44.2 55.2)"/><ellipse cx="40.1" cy="52.2" rx="6.2" ry="2.5" transform="rotate(273.5 40.1 52.2)"/><ellipse cx="59.0" cy="41.2" rx="5.9" ry="2.3" transform="rotate(354.0 59.0 41.2)"/><ellipse cx="56.0" cy="37.4" rx="5.9" ry="2.3" transform="rotate(290.0 56.0 37.4)"/></g></g>
        <g transform="translate(200 0) scale(-1 1)"><g class="branch"><path d="M92.3 173.6 A74 74 0 0 1 58.6 38.7" fill="none" stroke-width="2.2" stroke-linecap="round"/><g class="leaves"><ellipse cx="81.9" cy="168.2" rx="9.0" ry="3.6" transform="rotate(222.0 81.9 168.2)"/><ellipse cx="80.7" cy="175.5" rx="9.0" ry="3.6" transform="rotate(158.0 80.7 175.5)"/><ellipse cx="63.5" cy="160.5" rx="8.6" ry="3.4" transform="rotate(238.5 63.5 160.5)"/><ellipse cx="60.3" cy="166.9" rx="8.6" ry="3.4" transform="rotate(174.5 60.3 166.9)"/><ellipse cx="47.9" cy="148.0" rx="8.2" ry="3.3" transform="rotate(255.0 47.9 148.0)"/><ellipse cx="43.3" cy="152.9" rx="8.2" ry="3.3" transform="rotate(191.0 43.3 152.9)"/><ellipse cx="36.4" cy="131.5" rx="7.8" ry="3.1" transform="rotate(271.5 36.4 131.5)"/><ellipse cx="30.8" cy="134.7" rx="7.8" ry="3.1" transform="rotate(207.5 30.8 134.7)"/><ellipse cx="30.0" cy="112.4" rx="7.4" ry="3.0" transform="rotate(288.0 30.0 112.4)"/><ellipse cx="24.0" cy="113.9" rx="7.4" ry="3.0" transform="rotate(224.0 24.0 113.9)"/><ellipse cx="29.2" cy="92.3" rx="7.0" ry="2.8" transform="rotate(304.5 29.2 92.3)"/><ellipse cx="23.4" cy="92.0" rx="7.0" ry="2.8" transform="rotate(240.5 23.4 92.0)"/><ellipse cx="34.0" cy="72.7" rx="6.6" ry="2.7" transform="rotate(321.0 34.0 72.7)"/><ellipse cx="28.9" cy="70.9" rx="6.6" ry="2.7" transform="rotate(257.0 28.9 70.9)"/><ellipse cx="44.2" cy="55.2" rx="6.2" ry="2.5" transform="rotate(337.5 44.2 55.2)"/><ellipse cx="40.1" cy="52.2" rx="6.2" ry="2.5" transform="rotate(273.5 40.1 52.2)"/><ellipse cx="59.0" cy="41.2" rx="5.9" ry="2.3" transform="rotate(354.0 59.0 41.2)"/><ellipse cx="56.0" cy="37.4" rx="5.9" ry="2.3" transform="rotate(290.0 56.0 37.4)"/></g></g></g>
      </svg>
      <div class="count" aria-hidden="true">
        <strong id="years">3</strong>
        <span>YEARS</span>
      </div>
    </div>

    <div class="copy">
      <h1>Glorious years in service</h1>
      <p class="years" id="span">2023 &ndash; 2026</p>
      <p class="motto">Precision Restored, Performance Assured</p>
    </div>

    <div class="loader" role="progressbar" aria-label="Opening NTS"></div>

    <script>
      (function () {
        // The year Nutan Tech Solutions started; the count updates itself.
        var FOUNDED = 2023;
        var now = new Date().getFullYear();
        var years = Math.max(1, now - FOUNDED);
        document.getElementById("years").textContent = years;
        document.getElementById("span").textContent = FOUNDED + " – " + now;
        document.querySelector(".badge").setAttribute("aria-label", years + " years in service");

        // Long enough to be seen; the screen then stays up until the
        // dashboard (or the sign-in page) has loaded.
        setTimeout(function () { window.location.replace("/dashboard"); }, 1200);
      })();
    </script>
  </body>
</html>
