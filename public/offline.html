<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f9" />
    <meta name="robots" content="noindex" />
    <title>Offline · NTS</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- Static page served by the service worker when there is no connection.
         It must never contain user or company data. -->
    <style>
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --border: #e3e8ef;
        --fg: #131a24;
        --fg-muted: #566274;
        --accent: #1a6dff;
        --accent-hover: #1354d6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --surface: #151b23;
          --border: #262e3a;
          --fg: #e9edf3;
          --fg-muted: #9aa7b8;
          --accent: #4d8cff;
          --accent-hover: #6ba1ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--fg-muted);
        background: var(--bg);
      }
      .card {
        width: 100%;
        max-width: 400px;
        padding: 32px 24px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 12px 32px -8px rgb(16 24 40 / 0.18);
      }
      img { width: 150px; height: auto; margin-bottom: 20px; border-radius: 8px; }
      h1 { margin: 0 0 8px; font-size: 20px; color: var(--fg); }
      p { margin: 0 0 24px; font-size: 14px; line-height: 1.55; }
      button {
        padding: 10px 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: var(--accent-hover); }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/brand/nts-logo.png" alt="Nutan Tech Solutions" />
      <h1>You're offline</h1>
      <p>NTS needs an internet connection to show live data. Check your connection and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
